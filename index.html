<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Game Menu with Splash Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('images/bg-menu-green.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Splash Screen Styles */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
        }

        .splash-content {
            position: relative;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .splash-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #36FF01;
            box-shadow: 0 0 30px rgba(54, 255, 1, 0.7);
        }

        .circular-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: rotateText 15s linear infinite;
        }

        .circular-text span {
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: 0 100px;
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #36FF01;
            text-shadow: 0 0 10px rgba(54, 255, 1, 0.7);
            letter-spacing: 1px;
        }

        .splash-text {
            margin-top: 30px;
            font-size: 2.5rem;
            color: #36FF01;
            text-shadow: 0 0 20px rgba(54, 255, 1, 0.8);
            animation: glowPulse 2s infinite alternate;
        }

        .menu-container {
            text-align: center;
            color: #36FF01;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        .title {
            font-size: 4rem;
            text-shadow: 2px 2px 10px rgba(25, 155, 453, 0.7);
            /*glow */
            margin-bottom: 50px;
            animation: titleGlow 3s infinite alternate;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-button {
            background: linear-gradient(145deg, #296C02, #2D2DA8);
            color: white;
            font-size: 2rem;
            padding: 20px;
            width: 300px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 10px 20px rgba(25, 155, 453, 0.4);
            transform: scale(1);
        }

        .menu-button:hover {
            background: linear-gradient(160deg, #04FF61, #00B0FF);
            box-shadow: 0px 20px 40px rgba(25, 150, 500, 0.7);
            transform: scale(1.1);
            animation: none;
            /* Disable lavaGlow on hover */
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        @keyframes lavaGlow {
            0% {
                color: #FF6347;
            }

            50% {
                color: #36FF01;
            }

            100% {
                color: #4545FF;
            }
        }

        .menu-button:hover {
            animation: lavaGlow 2s infinite;
        }

        /* Splash Animations */
        @keyframes pulse {
            0% {
                transform: scale(0.95);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(0.95);
            }
        }

        @keyframes rotateText {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes glowPulse {
            from {
                text-shadow: 0 0 10px rgba(54, 255, 1, 0.8);
            }

            to {
                text-shadow: 0 0 30px rgba(54, 255, 1, 1), 0 0 50px rgba(54, 255, 1, 0.9);
            }
        }

        @keyframes titleGlow {
            from {
                text-shadow: 2px 2px 10px rgba(25, 155, 453, 0.7);
            }

            to {
                text-shadow: 0 0 20px rgba(25, 200, 453, 1), 0 0 40px rgba(25, 155, 453, 0.9);
            }
        }
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(15, 30, 15, 0.95);
            border: 2px solid #36FF01;
            box-shadow: 0 0 40px rgba(54, 255, 1, 0.4);
            border-radius: 20px;
            padding: 35px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            color: white;
            transform: scale(0.8);
            transition: transform 0.4s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 2.2rem;
            color: #36FF01;
            text-shadow: 0 0 15px rgba(54, 255, 1, 0.8);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mode-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(54, 255, 1, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
        }

        .mode-card:hover {
            background: rgba(54, 255, 1, 0.15);
            border-color: #36FF01;
            transform: translateX(5px);
        }

        .mode-card.selected {
            background: linear-gradient(135deg, rgba(54, 255, 1, 0.25), rgba(0, 176, 255, 0.25));
            border-color: #36FF01;
            box-shadow: 0 0 15px rgba(54, 255, 1, 0.5);
        }

        .mode-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #36FF01;
        }

        .mode-card-desc {
            font-size: 0.95rem;
            color: #ccc;
            margin-top: 5px;
        }

        .close-modal-btn {
            background: linear-gradient(145deg, #296C02, #2D2DA8);
            color: white;
            font-size: 1.2rem;
            padding: 12px 35px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-modal-btn:hover {
            background: linear-gradient(160deg, #04FF61, #00B0FF);
            transform: scale(1.05);
        }

        .mode-badge {
            display: block;
            font-size: 0.9rem;
            color: #04FF61;
            margin-top: 4px;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <img src="images/icon.png" alt="Game Logo" class="splash-image">

            <div class="splash-text">Jump in Green!</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div class="menu-container" id="menuContainer">
        <h1 class="title">Fate Runner</h1>
        <div class="button-container">
            <button class="menu-button" id="playButton">Play</button>
            <button class="menu-button" id="coopButton">Co-Op Mode</button>
            <button class="menu-button" id="modeButton">
                Mode
                <span class="mode-badge" id="currentModeBadge">(NORMAL)</span>
            </button>
        </div>
    </div>

    <!-- Difficulty Mode Modal -->
    <div class="modal-overlay" id="modeModal">
        <div class="modal-content">
            <h2 class="modal-title">Select Difficulty</h2>
            <div class="mode-options">
                <div class="mode-card" data-mode="easy">
                    <div class="mode-card-header">
                        <span>🟢 Easy Mode</span>
                        <span>5 Hearts</span>
                    </div>
                    <div class="mode-card-desc">Slower hazards & 5 extra hearts. Great for practice!</div>
                </div>

                <div class="mode-card" data-mode="normal">
                    <div class="mode-card-header">
                        <span>🟡 Normal Mode</span>
                        <span>3 Hearts</span>
                    </div>
                    <div class="mode-card-desc">Standard speed & 3 hearts. The classic experience!</div>
                </div>

                <div class="mode-card" data-mode="hardcore">
                    <div class="mode-card-header">
                        <span>🔴 Hardcore Mode</span>
                        <span>1 Heart</span>
                    </div>
                    <div class="mode-card-desc">25% faster hazards & ONLY 1 HEART! True nightmare challenge!</div>
                </div>
            </div>
            <button class="close-modal-btn" id="closeModalBtn">Confirm & Return</button>
        </div>
    </div>

    <script>
        // Handle splash screen animation
        setTimeout(function () {
            const splashScreen = document.getElementById('splashScreen');
            splashScreen.style.opacity = '0';

            setTimeout(function () {
                splashScreen.style.display = 'none';
                // Show main menu with animation
                const menuContainer = document.getElementById('menuContainer');
                menuContainer.style.opacity = '1';
                menuContainer.style.transform = 'translateY(0)';
            }, 800);
        }, 1500);

        // Difficulty Mode Management
        let currentMode = localStorage.getItem('fateRunnerDifficulty') || 'normal';

        function updateModeUI() {
            const badge = document.getElementById('currentModeBadge');
            if (badge) badge.textContent = `(${currentMode.toUpperCase()})`;

            document.querySelectorAll('.mode-card').forEach(card => {
                if (card.dataset.mode === currentMode) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }
        updateModeUI();

        // Button functionality
        document.getElementById('playButton').addEventListener('click', function () {
            window.location.href = 'html/mainGame.html';
        });

        document.getElementById('coopButton').addEventListener('click', function () {
            window.location.href = 'html/coopLobby.html';
        });

        const modeModal = document.getElementById('modeModal');
        document.getElementById('modeButton').addEventListener('click', function () {
            modeModal.classList.add('active');
        });

        document.getElementById('closeModalBtn').addEventListener('click', function () {
            modeModal.classList.remove('active');
        });

        document.querySelectorAll('.mode-card').forEach(card => {
            card.addEventListener('click', function () {
                currentMode = this.dataset.mode;
                localStorage.setItem('fateRunnerDifficulty', currentMode);
                updateModeUI();
            });
        });
    </script>
</body>

</html>
